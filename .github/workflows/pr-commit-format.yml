name: PR commit format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-commit-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate merge commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9][a-z0-9._/-]*\): .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use: <type>(<scope>): <description>"
            exit 1
          fi
          if [[ "$PR_TITLE" =~ \(#[0-9]+\)$ ]]; then
            echo "Do not add the PR number to the PR title; GitHub adds it during squash merge."
            exit 1
          fi
          echo "Expected squash commit: ${PR_TITLE} (#${PR_NUMBER})"

      - name: Verify squash merge configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}")"
          if ! jq -e '
            .allow_squash_merge == true and
            .allow_merge_commit == false and
            .allow_rebase_merge == false and
            .squash_merge_commit_title == "PR_TITLE"
          ' <<<"$settings" >/dev/null; then
            echo "Repository must allow only squash merges and use the PR title as the squash commit title."
            exit 1
          fi
