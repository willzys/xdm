name: PR commit format

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-commit-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate merge commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9][a-z0-9._/-]*\): .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use: <type>(<scope>): <description>"
            exit 1
          fi
          if [[ "$PR_TITLE" =~ \(#[0-9]+\)$ ]]; then
            echo "Do not add the PR number to the PR title; GitHub adds it during squash merge."
            exit 1
          fi
          echo "Expected squash commit: ${PR_TITLE} (#${PR_NUMBER})"
