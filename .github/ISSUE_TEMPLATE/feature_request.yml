name: Feature request
description: Propose a focused improvement to xdm
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation.

        Large features or architectural changes should be discussed before a pull request is opened.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without assuming a specific implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Official X API
        - Cache
        - Synchronization
        - Terminal interface
        - Demo
        - Build and tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: What should be included or explicitly excluded?

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request describes one focused outcome.
          required: true
